<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>m5 / Blockly 程式碼解析與截圖工具</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/msg/zh-hant.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #f8fafc;
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      z-index: 10;
    }
    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button, label.btn-upload {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    button:hover, label.btn-upload:hover { background: #1d4ed8; }
    button.btn-green { background: #059669; }
    button.btn-green:hover { background: #047857; }
    button.btn-secondary { background: #475569; }
    button.btn-secondary:hover { background: #334155; }
    #fileInput { display: none; }
    #main-container {
      flex: 1;
      position: relative;
    }
    #blocklyDiv {
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
    #drop-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      z-index: 99;
      pointer-events: none;
      backdrop-filter: blur(3px);
    }
    #drop-overlay.active { display: flex; }
    #status-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }
    #status-toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>m5 積木程式解析與清晰截圖工具</h1>
    </div>
    <div class="controls">
      <label class="btn-upload" for="fileInput">📁 開啟 .m5 / .xml</label>
      <input type="file" id="fileInput" accept=".m5,.xml">
      <button class="btn-secondary" id="btnPasteXml">📋 貼上 XML</button>
      <button class="btn-secondary" id="btnFit">🔍 置中適應</button>
      <button class="btn-green" id="btnCopyImg">📑 複製截圖到剪貼簿</button>
      <button class="btn-green" id="btnDownloadImg">📸 下載純白高清截圖 (PNG)</button>
    </div>
  </header>

  <div id="main-container">
    <div id="blocklyDiv"></div>
    <div id="drop-overlay">放開以載入 .m5 / .xml 積木檔案</div>
  </div>

  <div id="status-toast"></div>

  <script>
    // 1. 初始化繁體中文語系
    if (typeof Blockly !== 'undefined' && Blockly.Msg) {
      Blockly.setLocale(Blockly.Msg);
    }

    // 2. 註冊 mBlock 5 / Scratch 積木
    function registerMBlockBlocks() {
      if (!Blockly.Blocks['looks_say']) {
        Blockly.Blocks['looks_say'] = {
          init: function() {
            this.appendValueInput('TEXT').setCheck(null).appendField('說出');
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour('#9966FF');
            this.setTooltip('說出指定的文字');
          }
        };
      }
      if (!Blockly.Blocks['sensing_askandwait']) {
        Blockly.Blocks['sensing_askandwait'] = {
          init: function() {
            this.appendValueInput('TEXT').setCheck(null).appendField('詢問');
            this.appendDummyInput().appendField('並等待');
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour('#5CB1D6');
            this.setTooltip('詢問問題並等待回答');
          }
        };
      }
      if (!Blockly.Blocks['sensing_answer']) {
        Blockly.Blocks['sensing_answer'] = {
          init: function() {
            this.appendDummyInput().appendField('詢問的答案');
            this.setOutput(true, null);
            this.setColour('#5CB1D6');
            this.setTooltip('取得回答');
          }
        };
      }
      if (!Blockly.Blocks['event_whenflagclicked']) {
        Blockly.Blocks['event_whenflagclicked'] = {
          init: function() {
            this.appendDummyInput().appendField('當 ⚑ 被點擊');
            this.setNextStatement(true, null);
            this.setColour('#FFBF00');
            this.setTooltip('程式啟動');
          }
        };
      }
    }
    registerMBlockBlocks();

    // 3. 建立工作區
    const blocklyDiv = document.getElementById('blocklyDiv');
    const workspace = Blockly.inject(blocklyDiv, {
      media: 'https://unpkg.com/blockly/media/',
      readOnly: false,
      scrollbars: true,
      zoom: {
        controls: true,
        wheel: true,
        startScale: 0.9,
        maxScale: 3,
        minScale: 0.2,
        scaleSpeed: 1.1
      },
      grid: {
        spacing: 25,
        length: 3,
        colour: '#e2e8f0',
        snap: false
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('status-toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function autoRegisterUnknownBlocks(xmlDoc) {
      const blocks = xmlDoc.querySelectorAll('block, shadow');
      blocks.forEach(el => {
        const type = el.getAttribute('type');
        if (type && !Blockly.Blocks[type]) {
          Blockly.Blocks[type] = {
            init: function() {
              this.appendDummyInput().appendField(`[${type}]`);
              this.setPreviousStatement(true, null);
              this.setNextStatement(true, null);
              this.setOutput(true, null);
              this.setColour('#7c3aed');
            }
          };
        }
      });
    }

    function loadXmlContent(rawXml) {
      try {
        let cleanXml = rawXml.trim();
        cleanXml = cleanXml.replace(/^```xml/i, '').replace(/^```/, '').replace(/```$/, '').trim();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(cleanXml, 'text/xml');
        if (xmlDoc.querySelector('parsererror')) {
          throw new Error('XML 格式錯誤，無法解析。');
        }
        autoRegisterUnknownBlocks(xmlDoc);
        workspace.clear();
        Blockly.Xml.domToWorkspace(xmlDoc.documentElement, workspace);
        workspace.scrollCenter();
        showToast('✅ 成功載入積木！');
      } catch (err) {
        alert('載入失敗：' + err.message);
      }
    }

    document.getElementById('btnFit').addEventListener('click', () => {
      workspace.zoomToFit();
      workspace.scrollCenter();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => loadXmlContent(evt.target.result);
      reader.readAsText(file);
      e.target.value = '';
    });

    document.getElementById('btnPasteXml').addEventListener('click', () => {
      const text = prompt('請在此貼上 .m5 / XML 內容：');
      if (text && text.trim()) loadXmlContent(text);
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      document.getElementById('drop-overlay').classList.add('active');
    });
    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) {
        document.getElementById('drop-overlay').classList.remove('active');
      }
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      document.getElementById('drop-overlay').classList.remove('active');
      const file = e.dataTransfer.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => loadXmlContent(evt.target.result);
        reader.readAsText(file);
      }
    });

    // ==========================================
    // 徹底解決「黑底」與「黑參數框」的根本截圖演算法
    // ==========================================
    async function generateCleanWhiteSnapshot() {
      const topBlocks = workspace.getTopBlocks(true);
      if (topBlocks.length === 0) {
        alert('工作區內沒有積木可截圖！');
        return null;
      }

      // 1. 精準取得積木邊界（只算積木群，不包含整個 workspace 背景）
      const bbox = workspace.getBlocksBoundingBox();
      const padding = 30;
      const width = Math.ceil(bbox.right - bbox.left + padding * 2);
      const height = Math.ceil(bbox.bottom - bbox.top + padding * 2);

      // 2. 只提取積木畫布層 (blocklyBlockCanvas)，不拿帶有網格底色遮罩的 parentSvg
      const blockCanvas = workspace.getCanvas();
      const clonedBlockCanvas = blockCanvas.cloneNode(true);

      // 將積木群的位置平移到 (padding, padding)
      clonedBlockCanvas.setAttribute('transform', `translate(${-bbox.left + padding}, ${-bbox.top + padding})`);

      // 3. 建立一個全新、乾淨、獨立的 SVG
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.style.backgroundColor = '#ffffff';

      // 4. 在 SVG 最底層放一個強制實心純白矩形，絕無透明度
      const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bgRect.setAttribute('x', '0');
      bgRect.setAttribute('y', '0');
      bgRect.setAttribute('width', '100%');
      bgRect.setAttribute('height', '100%');
      bgRect.setAttribute('fill', '#ffffff');
      svg.appendChild(bgRect);

      // 5. 抓取所有 Blockly 樣式，並強制修復參數輸入框與文字
      let cssRules = '';
      for (const sheet of document.styleSheets) {
        try {
          for (const rule of sheet.cssRules) {
            if (rule.cssText && rule.cssText.includes('blockly')) {
              cssRules += rule.cssText + '\n';
            }
          }
        } catch (e) {}
      }

      // 注入關鍵樣式覆蓋：解決輸入框黑塊與文字缺失
      cssRules += `
        .blocklyFieldRect {
          fill: #ffffff !important;
          fill-opacity: 1 !important;
          stroke: #cbd5e1 !important;
          stroke-width: 1px !important;
        }
        .blocklyEditableText rect {
          fill: #ffffff !important;
          fill-opacity: 1 !important;
        }
        .blocklyText {
          fill: #1e293b !important;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif !important;
          font-weight: 600 !important;
        }
        .blocklyDropdownText {
          fill: #1e293b !important;
        }
      `;

      const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      styleEl.textContent = cssRules;
      svg.appendChild(styleEl);

      // 6. 強制對被 clone 的所有輸入框手動寫入屬性，防止任何 CSS 丟失情況
      const rects = clonedBlockCanvas.querySelectorAll('rect');
      rects.forEach(r => {
        const cls = r.getAttribute('class') || '';
        if (cls.includes('blocklyFieldRect') || r.parentNode.classList.contains('blocklyEditableText')) {
          r.setAttribute('fill', '#ffffff');
          r.setAttribute('fill-opacity', '1');
          r.setAttribute('stroke', '#cbd5e1');
          r.style.fill = '#ffffff';
          r.style.fillOpacity = '1';
        }
      });

      // 7. 將積木層放入 SVG
      svg.appendChild(clonedBlockCanvas);

      // 8. 序列化為純 SVG 字串
      const svgString = new XMLSerializer().serializeToString(svg);
      const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

      // 9. 用 Canvas 放大 2.5 倍超高解析渲染
      const scale = 2.5;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      const ctx = canvas.getContext('2d');

      // 雙重保證底色為純白
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas);
        };
        img.onerror = (e) => {
          console.error(e);
          resolve(null);
        };
        img.src = svgUrl;
      });
    }

    // 下載圖片
    document.getElementById('btnDownloadImg').addEventListener('click', async () => {
      const btn = document.getElementById('btnDownloadImg');
      btn.innerText = '生成中...';
      const canvas = await generateCleanWhiteSnapshot();
      btn.innerText = '📸 下載純白高清截圖 (PNG)';
      if (!canvas) return;

      const link = document.createElement('a');
      link.download = `blockly-snapshot-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('🎉 純白高清截圖已成功下載！');
    });

    // 複製到剪貼簿
    document.getElementById('btnCopyImg').addEventListener('click', async () => {
      const btn = document.getElementById('btnCopyImg');
      btn.innerText = '複製中...';
      const canvas = await generateCleanWhiteSnapshot();
      btn.innerText = '📑 複製截圖到剪貼簿';
      if (!canvas) return;

      canvas.toBlob(async (blob) => {
        try {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          showToast('📋 已複製純白清晰截圖到剪貼簿！');
        } catch (e) {
          showToast('⚠️ 瀏覽器阻擋剪貼簿，改以直接下載');
          const link = document.createElement('a');
          link.download = `blockly-snapshot-${Date.now()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }
      }, 'image/png');
    });
  </script>
</body>
</html>
